# RakuOS: Plasma's /usr/share/xdg-desktop-portal/kde-portals.conf with the
# Secret portal moved from KWallet (ksecretd) to oo7, so KDE uses the same
# Secret Service as every other RakuOS desktop. xdg-desktop-portal reads this
# file instead of Plasma's, so keep the other lines in step with it. Backends
# are named after their .portal file: oo7's is oo7-portal.portal.
[preferred]
default=kde
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=oo7-portal
org.freedesktop.impl.portal.Notification=plasmanotify
